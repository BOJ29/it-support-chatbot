<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Dashboard - IT Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: #f5f7fa;
            padding: 15px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* ============ HEADER ============ */
        .header {
            background: #014711;
            color: white;
            padding: 18px 22px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(1,71,17,0.2);
        }
        
        .header h1 {
            font-size: 1.4em;
            font-weight: 700;
        }
        
        .header p {
            opacity: 0.85;
            font-size: 0.8em;
            margin-top: 3px;
        }
        
        .header-stats {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .stat-box {
            background: rgba(255,255,255,0.15);
            padding: 10px 18px;
            border-radius: 10px;
            text-align: center;
            min-width: 70px;
        }
        
        .stat-number {
            font-size: 1.5em;
            font-weight: 700;
            line-height: 1.2;
        }
        
        .stat-label {
            font-size: 0.7em;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .refresh-btn {
            background: #8dc73f;
            color: #014711;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .export-btn {
            background: #ffffff;
            color: #014711;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .export-btn:hover {
            background: #8dc73f;
            transform: scale(1.03);
        }
        
        .refresh-btn:hover {
            background: white;
            color: #014711;
        }
        
        /* ============ STATS PANEL ============ */
        .stats-panel {
            display: none;
            background: #f8faf7;
            border: 2px solid #8dc73f;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .stats-panel.show {
            display: block;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .stat-card {
            text-align: center;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .stat-card .number {
            font-size: 2em;
            font-weight: 700;
            color: #014711;
        }
        
        .stat-card .label {
            font-size: 0.8em;
            color: #888;
        }
        
        /* ============ TICKET CARDS ============ */
        .ticket-card {
            background: white;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 12px;
            border-left: 5px solid #8dc73f;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }
        
        .ticket-card:hover {
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transform: translateX(3px);
        }
        
        .ticket-card.priority-high {
            border-left-color: #e74c3c;
        }
        
        .ticket-card.priority-critical {
            border-left-color: #c0392b;
            background: #fff5f5;
        }
        
        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .ticket-id {
            font-size: 1.1em;
            font-weight: 700;
            color: #014711;
        }
        
        .badge-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .priority-badge {
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.75em;
            font-weight: 700;
            white-space: nowrap;
        }
        
        .priority-medium {
            background: #fff3cd;
            color: #856404;
        }
        
        .priority-high {
            background: #ffe5e5;
            color: #cc0000;
        }
        
        .priority-critical {
            background: #ff0000;
            color: white;
        }
        
        .status-open {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.75em;
            font-weight: 600;
            white-space: nowrap;
        }
        
        .status-resolved {
            background: #1a5632;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.75em;
            font-weight: 600;
            white-space: nowrap;
        }
        
        .ticket-issue {
            color: #555;
            line-height: 1.6;
            margin: 8px 0;
            font-size: 0.9em;
        }
        
        .ticket-user {
            background: #f0f4f0;
            padding: 8px 12px;
            border-radius: 8px;
            margin: 8px 0;
            font-size: 0.85em;
            color: #333;
        }
        
        .ticket-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            color: #888;
            font-size: 0.78em;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .no-tickets {
            text-align: center;
            padding: 50px 20px;
            color: #888;
            font-size: 1.1em;
        }
        
        .resolve-btn {
            background: #8dc73f;
            color: #014711;
            border: none;
            padding: 7px 16px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.82em;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .resolved-badge {
            background: #1a5632;
            color: #ffffff;
            padding: 7px 16px;
            border-radius: 18px;
            font-size: 0.82em;
            font-weight: 700;
            white-space: nowrap;
            display: inline-block;
        }
        
        .resolve-btn:hover {
            background: #014711;
            color: white;
        }
        
        /* ============ MOBILE RESPONSIVE ============ */
        @media (max-width: 768px) {
            body { padding: 8px; }
            .header { padding: 14px 16px; flex-direction: column; align-items: flex-start; }
            .header h1 { font-size: 1.2em; }
            .header-stats { width: 100%; justify-content: space-between; flex-wrap: wrap; }
            .stat-box { padding: 8px 14px; min-width: 60px; }
            .stat-number { font-size: 1.3em; }
            .ticket-card { padding: 14px 16px; }
            .ticket-id { font-size: 1em; }
            .ticket-issue { font-size: 0.85em; }
            .ticket-footer { font-size: 0.72em; }
            .stats-grid { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 480px) {
            .header-stats { gap: 8px; }
            .stat-box { padding: 6px 10px; min-width: 50px; }
            .stat-number { font-size: 1.1em; }
            .stat-label { font-size: 0.6em; }
            .refresh-btn, .export-btn { padding: 8px 14px; font-size: 0.78em; }
            .ticket-card { padding: 12px 14px; }
            .ticket-header { gap: 6px; }
            .priority-badge, .status-open, .status-resolved { font-size: 0.7em; padding: 3px 10px; }
            .resolve-btn { padding: 6px 14px; font-size: 0.75em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🎫 Support Tickets</h1>
                <p>Real-time ticket management</p>
            </div>
            <div class="header-stats">
                <div class="stat-box">
                    <div class="stat-number" id="openCount">0</div>
                    <div class="stat-label">Open</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">Total</div>
                </div>
                <button class="refresh-btn" onclick="loadTickets()">🔄 Refresh</button>
                <button class="export-btn" onclick="exportCSV()">📥 Export CSV</button>
                <button class="export-btn" onclick="toggleStats()">📊 Statistics</button>
                <img src="/static/Agmas LinkedIn Carousel.png" alt="Company Logo" 
                     style="width:45px; height:45px; border-radius:8px; object-fit:contain; background:white; padding:3px; margin-left:8px;"
                     onerror="this.style.display='none';">
            </div>
        </div>
        
        <!-- STATS PANEL -->
        <div class="stats-panel" id="statsPanel">
            <h3 style="color:#014711; margin-bottom:15px;">📊 Monthly Statistics</h3>
            <div class="stats-grid" id="statsGrid"></div>
            <div id="categoryBreakdown"></div>
        </div>
        
        <div id="ticketsList">
            <div class="no-tickets">Loading tickets...</div>
        </div>
    </div>

    <script>
        async function loadTickets() {
            try {
                const response = await fetch('/api/tickets');
                const tickets = await response.json();
                
                const openTickets = tickets.filter(t => t.status === 'Open');
                document.getElementById('openCount').textContent = openTickets.length;
                document.getElementById('totalCount').textContent = tickets.length;
                
                if (tickets.length === 0) {
                    document.getElementById('ticketsList').innerHTML = 
                        '<div class="no-tickets">✅ All clear! No pending tickets.</div>';
                    return;
                }
                
                document.getElementById('ticketsList').innerHTML = tickets.map(ticket => `
                    <div class="ticket-card priority-${ticket.priority ? ticket.priority.toLowerCase() : 'medium'}">
                        <div class="ticket-header">
                            <span class="ticket-id">#${ticket.id}</span>
                            <div class="badge-group">
                                <span class="priority-badge priority-${ticket.priority ? ticket.priority.toLowerCase() : 'medium'}">
                                    ${ticket.priority || 'Medium'}
                                </span>
                                <span class="${ticket.status === 'Open' ? 'status-open' : 'status-resolved'}">
                                    ${ticket.status || 'Open'}
                                </span>
                            </div>
                        </div>
                        <div class="ticket-issue">
                            <strong>Issue:</strong> ${ticket.issue_description || 'N/A'}
                        </div>
                        <div class="ticket-user">
                            <strong>👤 Staff:</strong> ${ticket.staff_name || 'Unknown'} 
                            <strong>📧 Email:</strong> ${ticket.staff_email || ticket.user_id || 'N/A'}
                        </div>
                        <div class="ticket-footer">
                            <span>📅 ${new Date(ticket.created_date).toLocaleString()}</span>
                            ${ticket.status === 'Open' ? 
                                `<button class="resolve-btn" onclick="resolveTicket(${ticket.id})">✅ Resolve</button>` 
                                : `<span class="resolved-badge">✅ Resolved</span>`}
                        </div>
                    </div>
                `).join('');
                
            } catch (error) {
                document.getElementById('ticketsList').innerHTML = 
                    '<div class="no-tickets">❌ Error loading tickets</div>';
                console.error('Error:', error);
            }
        }
        
        async function resolveTicket(ticketId) {
            try {
                const response = await fetch('/api/resolve/' + ticketId, { method: 'POST' });
                if (response.ok) {
                    loadTickets();
                } else {
                    alert('Error resolving ticket');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        function exportCSV() {
            window.open('/api/export-tickets', '_blank');
        }
        
        async function toggleStats() {
            const panel = document.getElementById('statsPanel');
            
            if (panel.classList.contains('show')) {
                panel.classList.remove('show');
                return;
            }
            
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                
                const ms = data.month_stats || {};
                const categories = data.categories || [];
                
                document.getElementById('statsGrid').innerHTML = `
                    <div class="stat-card">
                        <div class="number">${ms.total_tickets || 0}</div>
                        <div class="label">Total Tickets</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" style="color:#8dc73f;">${ms.open_tickets || 0}</div>
                        <div class="label">Open</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" style="color:#1a5632;">${ms.resolved_tickets || 0}</div>
                        <div class="label">Resolved</div>
                    </div>
                `;
                
                let categoryHTML = '<h4 style="margin-bottom:10px;">Category Breakdown:</h4>';
                if (categories.length > 0) {
                    categories.forEach(c => {
                        categoryHTML += `
                            <div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #e0e0e0;">
                                <span>${c.category}</span>
                                <strong>${c.count}</strong>
                            </div>
                        `;
                    });
                } else {
                    categoryHTML += '<p>No data this month</p>';
                }
                
                document.getElementById('categoryBreakdown').innerHTML = categoryHTML;
                panel.classList.add('show');
                
            } catch (error) {
                alert('Error loading stats: ' + error.message);
            }
        }
        
        loadTickets();
        setInterval(loadTickets, 30000);
    </script>
</body>
</html>
