<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Statistics - IT Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #014711;
            --secondary: #8dc73f;
            --white: #ffffff;
            --light-bg: #f8faf7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #f0f4f0 0%, #e8f0e8 50%, #f0f4f0 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            background: linear-gradient(135deg, #014711, #023d18);
            color: white;
            padding: 22px 28px;
            border-radius: 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 15px 50px rgba(1,71,17,0.3);
            position: relative;
            overflow: hidden;
        }

        .page-header::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -10%;
            width: 250px;
            height: 250px;
            background: rgba(141, 199, 63, 0.15);
            border-radius: 50%;
        }

        .page-header h1 {
            font-size: 1.5em;
            font-weight: 700;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header h1 svg {
            width: 26px;
            height: 26px;
            stroke: #8dc73f;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .back-btn {
            background: rgba(255,255,255,0.15);
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 0.85em;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            position: relative;
            z-index: 1;
        }

        .back-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .back-btn:hover {
            background: #8dc73f;
            color: #014711;
        }

        .stats-overview {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
        }

        .stat-icon svg {
            width: 20px;
            height: 20px;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .stat-card .number {
            font-size: 2.2em;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .stat-card .label {
            font-size: 0.8em;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .chart-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .chart-card h3 {
            color: #014711;
            margin-bottom: 20px;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-card h3 svg {
            width: 18px;
            height: 18px;
            stroke: #014711;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .chart-card canvas {
            max-height: 300px;
        }

        .table-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .table-card h3 {
            color: #014711;
            margin-bottom: 20px;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-card h3 svg {
            width: 18px;
            height: 18px;
            stroke: #014711;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #014711;
            color: white;
            padding: 12px 15px;
            text-align: left;
            font-size: 0.85em;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e8f0e8;
            font-size: 0.9em;
            color: #333;
        }

        tr:hover td {
            background: #f8faf7;
        }

        @media (max-width: 768px) {
            .stats-overview { grid-template-columns: repeat(2, 1fr); }
            .chart-grid { grid-template-columns: 1fr; }
            .page-header { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>
                <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                Monthly Statistics
            </h1>
            <button class="back-btn" onclick="window.location.href='/admin/tickets'">
                <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Back to Dashboard
            </button>
        </div>

        <div class="stats-overview" id="statsOverview"></div>

        <div class="chart-grid">
            <div class="chart-card">
                <h3>
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    Ticket Status Distribution
                </h3>
                <canvas id="statusChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>
                    <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                    Issues by Category
                </h3>
                <canvas id="categoryChart"></canvas>
            </div>
        </div>

        <div class="chart-grid">
            <div class="chart-card">
                <h3>
                    <svg viewBox="0 0 24 24"><path d="M12 2l3 7h6l-5 4 2 7-6-4-6 4 2-7-5-4h6z"/></svg>
                    Priority Distribution
                </h3>
                <canvas id="priorityChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>
                    <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                    Weekly Ticket Trend
                </h3>
                <canvas id="trendChart"></canvas>
            </div>
        </div>

        <div class="table-card">
            <h3>
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
                Category Breakdown
            </h3>
            <table>
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Total Tickets</th>
                    </tr>
                </thead>
                <tbody id="categoryTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                
                const ms = data.month_stats || {};
                const categories = data.categories || [];
                
                document.getElementById('statsOverview').innerHTML = `
                    <div class="stat-card">
                        <div class="stat-icon" style="background:#e8f5e9;">
                            <svg viewBox="0 0 24 24" style="stroke:#014711;"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>
                        </div>
                        <div class="number" style="color:#014711;">${ms.total_tickets || 0}</div>
                        <div class="label">Total Tickets</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background:#fff3cd;">
                            <svg viewBox="0 0 24 24" style="stroke:#856404;"><circle cx="12" cy="12" r="10"/></svg>
                        </div>
                        <div class="number" style="color:#856404;">${ms.open_tickets || 0}</div>
                        <div class="label">Open</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background:#e8f5e9;">
                            <svg viewBox="0 0 24 24" style="stroke:#1a5632;"><path d="M20 6L9 17l-5-5"/></svg>
                        </div>
                        <div class="number" style="color:#1a5632;">${ms.resolved_tickets || 0}</div>
                        <div class="label">Resolved</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="background:#ffe5e5;">
                            <svg viewBox="0 0 24 24" style="stroke:#e74c3c;"><path d="M12 2l3 7h6l-5 4 2 7-6-4-6 4 2-7-5-4h6z"/></svg>
                        </div>
                        <div class="number" style="color:#e74c3c;">${ms.high_priority || 0}</div>
                        <div class="label">High Priority</div>
                    </div>
                `;
                
                new Chart(document.getElementById('statusChart'), {
                    type: 'doughnut',
                    data: {
                        labels: ['Open', 'Resolved'],
                        datasets: [{
                            data: [ms.open_tickets || 0, ms.resolved_tickets || 0],
                            backgroundColor: ['#8dc73f', '#1a5632'],
                            borderWidth: 0
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
                });
                
                new Chart(document.getElementById('categoryChart'), {
                    type: 'bar',
                    data: {
                        labels: categories.map(c => c.category),
                        datasets: [{
                            label: 'Tickets',
                            data: categories.map(c => c.count),
                            backgroundColor: '#8dc73f',
                            borderRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true } }
                    }
                });
                
                new Chart(document.getElementById('priorityChart'), {
                    type: 'pie',
                    data: {
                        labels: ['Critical', 'High', 'Medium'],
                        datasets: [{
                            data: [ms.critical_priority || 0, ms.high_priority || 0, ms.medium_priority || 0],
                            backgroundColor: ['#ff0000', '#e74c3c', '#fff3cd'],
                            borderWidth: 0
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
                });
                
                new Chart(document.getElementById('trendChart'), {
                    type: 'line',
                    data: {
                        labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                        datasets: [{
                            label: 'Tickets',
                            data: [0, 0, ms.total_tickets || 0, 0],
                            borderColor: '#014711',
                            backgroundColor: 'rgba(141, 199, 63, 0.2)',
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true } }
                    }
                });
                
                document.getElementById('categoryTable').innerHTML = categories.map(c => `
                    <tr>
                        <td><strong>${c.category}</strong></td>
                        <td>${c.count}</td>
                    </tr>
                `).join('');
                
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        loadStats();
    </script>
</body>
</html>
