<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Support Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: #f5f7fa;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        
        .chat-wrapper {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-header {
            background: #014711;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 4px solid #8dc73f;
        }
        
        .chat-header h2 {
            font-size: 1.1em;
            font-weight: 700;
            flex: 1;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.75em;
            color: #8dc73f;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: #8dc73f;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8faf7;
        }
        
        .message-bubble {
            margin: 10px 0;
            max-width: 80%;
            clear: both;
        }
        
        .message-bubble.staff {
            float: left;
        }
        
        .message-bubble.it-support {
            float: right;
        }
        
        .bubble-content {
            padding: 10px 15px;
            border-radius: 15px;
            display: inline-block;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 0.9em;
        }
        
        .message-bubble.staff .bubble-content {
            background: #e8f5e9;
            color: #333;
            border-bottom-left-radius: 5px;
        }
        
        .message-bubble.it-support .bubble-content {
            background: #014711;
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .sender-name {
            font-size: 0.7em;
            font-weight: 700;
            display: block;
            margin-bottom: 3px;
        }
        
        .chat-input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        
        #chatInput {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #8dc73f;
            border-radius: 25px;
            font-size: 0.9em;
            font-family: 'Montserrat', sans-serif;
            outline: none;
        }
        
        #sendBtn {
            background: #8dc73f;
            color: #014711;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        #sendBtn:hover {
            background: #014711;
            color: white;
        }
        
        .ticket-info {
            background: #fff3cd;
            padding: 10px 15px;
            text-align: center;
            font-size: 0.85em;
            color: #856404;
        }
        
        @media (max-width: 768px) {
            body { padding: 0; }
            .chat-wrapper { height: 100vh; max-width: 100%; border-radius: 0; }
            .message-bubble { max-width: 90%; }
        }
    </style>
</head>
<body>
    <div class="chat-wrapper">
        <div class="chat-header">
            <h2>💬 IT Support Chat</h2>
            <div class="status-indicator">
                <span class="status-dot"></span> Live
            </div>
        </div>
        
        <div class="ticket-info" id="ticketInfo">
            Ticket #<span id="ticketIdDisplay">-</span>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <p style="text-align:center; color:#888;">Connecting to IT Support...</p>
        </div>
        
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Type your message..." autocomplete="off">
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const staffName = localStorage.getItem('staffName') || 'Staff';
        const staffEmail = localStorage.getItem('staffEmail') || '';
        let ticketId = null;
        
        // Get ticket ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        ticketId = urlParams.get('ticket_id');
        
        if (ticketId) {
            document.getElementById('ticketIdDisplay').textContent = ticketId;
        }
        
        document.getElementById('chatInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
        
        async function loadMessages() {
            if (!ticketId) return;
            
            try {
                const response = await fetch('/api/ticket/' + ticketId + '/messages');
                const messages = await response.json();
                
                const chatDiv = document.getElementById('chatMessages');
                
                if (messages.length === 0) {
                    chatDiv.innerHTML = '<p style="text-align:center; color:#888;">👋 Say hello! IT Support is ready to help.</p>';
                    return;
                }
                
                chatDiv.innerHTML = messages.map(msg => {
                    const isIT = msg.sender === 'IT Support';
                    return `
                        <div class="message-bubble ${isIT ? 'it-support' : 'staff'}" style="overflow:auto;">
                            <div class="bubble-content">
                                <span class="sender-name">${msg.sender}</span>
                                ${msg.message}
                            </div>
                        </div>
                    `;
                }).join('');
                
                chatDiv.scrollTop = chatDiv.scrollHeight;
                
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message || !ticketId) return;
            
            try {
                const response = await fetch('/api/ticket/' + ticketId + '/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        sender: staffName, 
                        message: message 
                    })
                });
                
                if (response.ok) {
                    input.value = '';
                    loadMessages();
                }
            } catch (error) {
                alert('Error sending message');
            }
        }
        
        // Auto-refresh every 3 seconds
        loadMessages();
        setInterval(loadMessages, 3000);
    </script>
</body>
</html>
